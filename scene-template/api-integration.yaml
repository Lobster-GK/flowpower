id: api-integration
name: 接口集成
description: 仅在用户明确提供接口文档时，为前端功能补充接口集成。
notes:
  - 不要编造接口地址、字段、枚举值、权限规则或业务规则。
  - 如果用户没有提供接口文档，跳过该场景，不要凭空集成接口。
match:
  intents:
    - api-integration
    - connect-api
    - integrate-api
  requires:
    - api-doc
stages:
  - id: confirm-api-doc
    instruction: 修改代码前，先确认接口文档来源、目标页面/组件文件和需要接入的交互入口。
  - id: context
    instruction: 读取和当前接口接入相关的项目资产、API 客户端封装、目标页面和同类接口调用方式，只返回任务相关事实。
    use:
      subagent: afp-context-agent
  - id: api-integration
    use:
      subagent: afp-builder-agent
      skill: frontend-api-integration
  - id: lint
    use:
      subagent: afp-verifier-agent
      skill: frontend-lint-check
    onFail: fix-and-retry
    maxRetries: 3
  - id: boot
    use:
      subagent: afp-verifier-agent
      skill: frontend-boot-check
    onFail: fix-and-retry
    maxRetries: 3
  - id: runtime
    use:
      subagent: afp-verifier-agent
      skill: frontend-runtime-check
    onFail: fix-and-retry
    maxRetries: 3
  - id: final-summary
    instruction: 总结接口接入改动、验证结果，以及仍未覆盖的接口行为或联调风险。
