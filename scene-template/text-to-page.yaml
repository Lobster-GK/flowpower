id: text-to-page
name: 文本生成页面
description: 根据文字产品需求或 UI 需求生成前端页面。
notes:
  - 根据文字需求生成布局说明规格文档；除非用户提供图片，否则不要执行图片分析。
  - 如果用户同时提供多张图片，默认视为同一页面的不同状态，除非用户明确说明它们是不同页面。
  - UI 识别前必须读取当前 stage 的 multiAgent 策略，并严格遵守。
  - 在布局说明规格文档、组件映射规格文档和生码计划规格文档都可用之前，不要开始生码。
  - 如果用户没有指定 targetDir，选择语义明确的 kebab-case 页面目录。
  - 代码生成阶段必须返回：targetDir、route
  - 若用户未提供接口文档，接口补充阶段标记为 `skipped`。
  - 检查顺序固定为：lint → boot → runtime
  - 只需要给本次生码的page和view文件生成单测，如果本次生成components目录，则也需要生层单测
match:
  intents:
    - text-codegen
    - create-page
    - generate-page
artifacts:
  root: .codegen/artifacts/{{taskId}}
  files:
    layoutSpec: 01-ui-layout-spec.md
    componentMappingSpec: 02-component-mapping-spec.md
    codegenPlanSpec: 03-codegen-plan-spec.md
stages:
  - id: clarify-target
    instruction: 生成文件前，先从用户需求或项目上下文中确认目标目录、路由和 rootDomId。
  - id: context
    instruction: 读取和当前文字生码任务相关的项目资产、目标目录、同类页面、组件库约定和已有实现模式，只返回任务相关事实。
    use:
      subagent: afp-context-agent
  - id: ui-layout-spec
    instruction: 如果本阶段 multiAgent.enabled=true，必须让多个同职责但上下文完全独立的 agent 同时观察所有文字/图片输入，并委派一个子agent合并成唯一布局说明规格文档；否则直接生成一份布局说明规格文档。
    multiAgent:
      enabled: false
      agentCount: 3
      mode: same-role-observation
      persistOutputs: true
      outputDir: ui-recognition-observations
    use:
      subagent: afp-observer-agent
      skill: frontend-ui-layout-spec
    output: artifacts.layoutSpec
  - id: component-mapping-spec
    instruction: 如果本阶段 multiAgent.enabled=true，必须把图片地址交给多个同职责但上下文完全独立的 agent 同时观察所有图片生成组件映射规格文档并放置在指定目录下。并委派一个子agent合并成唯一组件映射规格文档；否则直接生成一份组件映射规格文档。
    multiAgent:
      enabled: true
      agentCount: 3
      mode: same-role-observation
      persistOutputs: true
      outputDir: ui-recognition-observations
    use:
      subagent: afp-planner-agent
      skill: frontend-component-mapping-spec
    requires:
      - artifacts.layoutSpec
    output: artifacts.componentMappingSpec
  - id: codegen-plan
    instruction: 生成生码计划
    use:
      subagent: afp-planner-agent
      skill: frontend-codegen-plan
    requires:
      - artifacts.layoutSpec
      - artifacts.componentMappingSpec
    output: artifacts.codegenPlanSpec
  - id: codegen
    instruction: 严格按 codegenPlanSpec、layoutSpec、componentMappingSpec 生成代码
    use:
      subagent: afp-builder-agent
      skill: frontend-ui-codegen
    requires:
      - artifacts.layoutSpec
      - artifacts.componentMappingSpec
      - artifacts.codegenPlanSpec
    output: route
  - id: api
    instruction: 接口逻辑补充
    use:
      subagent: afp-builder-agent
      skill: frontend-api-integration
    requires:
      - 接口文档
  - id: lint
    instruction: lint 检查
    use:
      subagent: afp-verifier-agent
      skill: frontend-lint-check
    onFail: fix-and-retry
    maxRetries: 3
  - id: boot
    instruction: boot 检查  
    use:
      subagent: afp-verifier-agent
      skill: frontend-boot-check
    onFail: fix-and-retry
    maxRetries: 3
  - id: runtime
    instruction: runtime 检查
    use:
      subagent: afp-verifier-agent
      skill: frontend-runtime-check
    onFail: fix-and-retry
    maxRetries: 5
  - id: unit-test
    instruction: 单元测试生成
    use:
      subagent: afp-builder-agent
      skill: fontend-unit-test-rule、cmbc-apollo-test-generator
  - id: final-summary
    instruction: 总结修改文件、验证结果和剩余风险。
