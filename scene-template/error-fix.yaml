id: error-fix
name: 错误修复
description: 针对明确的 lint、启动、运行时或 UI 审查错误，做最小必要修复。
notes:
  - 只修复和当前错误报告相关的文件。
  - 修复失败时避免无关重构。
  - 修改前必须生成持久化生码计划，确保根因、目标文件、修复步骤和验证方式在上下文压缩后仍可追踪。
match:
  intents:
    - bugfix
    - fix-error
    - repair-failure
  requires:
    - error-report
artifacts:
  codegenPlanSpec: 03-codegen-plan-spec.md
stages:
  - id: scope-error
    instruction: 修改前先识别失败命令、错误信息，以及最可能相关的文件范围。
  - id: context
    instruction: 读取和当前错误相关的文件、项目资产、近期实现和验证证据，只返回修复需要的事实。
    use:
      subagent: afp-context-agent
  - id: codegen-plan
    use:
      subagent: afp-planner-agent
      skill: frontend-codegen-plan
    output: artifacts.codegenPlanSpec
  - id: fix
    use:
      subagent: afp-builder-agent
      skill: frontend-error-fix
    requires:
      - artifacts.codegenPlanSpec
  - id: lint
    use:
      subagent: afp-verifier-agent
      skill: frontend-lint-check
    onFail: fix-and-retry
    maxRetries: 3
  - id: boot
    use:
      subagent: afp-verifier-agent
      skill: frontend-boot-check
    onFail: fix-and-retry
    maxRetries: 3
  - id: final-summary
    instruction: 总结错误根因、修改文件和验证结果。
